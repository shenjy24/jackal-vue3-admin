services:
  app-web:
    image: ${APP_IMAGE:-jackal-vue3-admin:prod-placeholder}
    container_name: ${APP_CONTAINER_NAME:-jackal-vue3-admin-prod}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-18080}:80"
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${APP_MEMORY_RESERVATION:-256M}
