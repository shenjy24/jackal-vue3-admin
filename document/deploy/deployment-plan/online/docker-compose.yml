services:
  jackal-vue3-admin:
    image: ${APP_IMAGE}
    container_name: ${APP_CONTAINER_NAME}
    build:
      context: ${APP_BUILD_CONTEXT:-.}
      dockerfile: ${APP_DOCKERFILE:-Dockerfile}
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${APP_PORT}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
