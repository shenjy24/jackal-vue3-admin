services:
  app-web:
    image: ${APP_IMAGE:-jackal-vue3-admin:prod-placeholder}
    container_name: ${APP_CONTAINER_NAME:-jackal-vue3-admin-prod}
    build:
      context: ${APP_BUILD_CONTEXT:-.}
      dockerfile: ${APP_DOCKERFILE:-Dockerfile}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.17.0-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.30.2-alpine}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${APP_PORT:-18080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
