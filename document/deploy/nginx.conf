# jackal-vue3-admin Nginx 配置
# 用途：宿主机 Nginx 配置，统一转发前端容器和后端 API
#
# 部署前请修改以下配置：
#   1. server_name → 改为实际域名或 IP
#   2. location / proxy_pass → 改为前端容器宿主机端口
#   3. location /admin/api/ proxy_pass → 改为后端 service-admin 实际地址

server {
  listen 80;
  server_name _;

  location /admin/api/ {
    proxy_pass http://127.0.0.1:18882/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
